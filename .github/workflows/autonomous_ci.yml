name: Munder Difflin Autonomous CI & Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Core Kernel Tests
        run: |
          pytest tests/test_kernel.py -v

      - name: Verify Multi-Agent LLM & Secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          python -c "
          import os
          gemini_present = bool(os.environ.get('GEMINI_API_KEY'))
          nvidia_present = bool(os.environ.get('NVIDIA_API_KEY'))
          print(f'Gemini Secret Present: {gemini_present}')
          print(f'NVIDIA Secret Present: {nvidia_present}')
          "
