name: Munder Difflin Autonomous CI & Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Core Kernel Tests
        run: |
          python -m unittest tests/test_kernel.py -v

      - name: Verify Multi-Agent LLM & Secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          python -c "
          import os
          gemini = os.environ.get('GEMINI_API_KEY', '')
          nvidia = os.environ.get('NVIDIA_API_KEY', '')
          print(f'Gemini Secret Configured: {bool(gemini)}')
          print(f'NVIDIA Secret Configured: {bool(nvidia)}')
          
          # Test LLM agent generation with secret
          from core.llm import LLMClient
          client = LLMClient(gemini_key=gemini, nvidia_key=nvidia)
          msg = client.agent_speak('Michael', 'Cloud verification test on GitHub Actions!')
          print(f'Michael Scott: {msg}')
          "
